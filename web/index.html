<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CalcAd</title>

  <meta name="theme-color" content="#1c1c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalcAd">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="calcAd.png">

  <link rel="stylesheet" href="css/math-helper.css">
</head>

<body>
  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        Calc<span>Ad</span>
      </div>

      <nav id="nav"></nav>
    </aside>

    <main class="main">

      <header class="topbar">
        <div>
          <h1>CalcAd</h1>
          <p id="moduleTitle" class="subtitle"></p>
        </div>

        <div class="language-switcher">
          <label id="languageLabel" for="languageSelect">
            Idioma
          </label>

          <select id="languageSelect">
            <option value="EN">EN</option>
            <option value="ES">ES</option>
            <option value="FI">FI</option>
          </select>
        </div>
      </header>

      <section id="content"></section>

    </main>

  </div>

  <script src="js/translations.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
